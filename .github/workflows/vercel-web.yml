name: Next.js Vercel preview checks
on:
  push:
    branches: [main, 'deployment/vercel-parallel-web-*']
    paths: ['web-ui/**', '.github/workflows/vercel-web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npx tsc --module commonjs --target es2022 --moduleResolution node --skipLibCheck --outDir .test-build lib/data.ts lib/engine.ts
      - run: node scripts/engine-safety-tests.cjs
